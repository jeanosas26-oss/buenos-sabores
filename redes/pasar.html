<!doctype html><meta charset="utf-8"><title>Pasando archivo</title><body style="font-family:sans-serif">Pasando archivo…<script>
(async()=>{const q=new URLSearchParams(location.search);const f=q.get('f'),to=q.get('to');
if(!/^https:\/\/(app\.hotmart\.com|www\.instagram\.com)\//.test(to))return document.body.textContent='destino no permitido';
const buf=new Uint8Array(await (await fetch(f+'?v='+Date.now())).arrayBuffer());
let s='';for(let i=0;i<buf.length;i+=32768)s+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));
location.replace(to+'#bsfile='+encodeURIComponent(f)+':'+btoa(s));})();
</script>
