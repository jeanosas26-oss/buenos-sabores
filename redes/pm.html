<!doctype html><meta charset="utf-8"><script>
(async()=>{const f=new URLSearchParams(location.search).get('f');try{const b=await (await fetch('sem/'+f+'?v='+Date.now())).arrayBuffer();parent.postMessage({bsfile:f,buf:b},'*',[b])}catch(e){parent.postMessage({bsfile:f,err:String(e)},'*')}})();
</script>
